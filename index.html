<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Preview Card</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <link  rel="stylesheet" href="./styles.css"  >

</head>
<body>
    <main>
        <article>
            <div class="img-container">
                <!-- For Responsive Images -->
                <picture>
                    <source 
                        media="(min-width: 550px)"
                        srcset="./images/image-product-desktop.jpg" >

                    <img class="product-image"  src="./images/image-product-mobile.jpg" 
                            alt="Gabrielle Essence Eau De Parfum perfume bottle" /> 
                </picture>
                
            </div>

            <div class="content-container">

                <p class="category"> PERFUME </p>
                <h1 class="title">Gabrielle Essence Eau De Parfum</h1>
                <p class="description"> A floral, solar and voluptuous interpretation composed by Olivier Polge, 
                    Perfumer-Creator for the House of CHANEL.</p>

                <div class="price-container">
                    <span class="current-price">$149.99</span> 
                    <del class="old-price">$169.99</del>
                </div>
                

                <button class="button"> 
                    <img src="./images/icon-cart.svg" alt="Add to Cart, button" />
                    Add to Cart
                </button>

            </div>
        </article>
    </main>
</body>
</html>
